<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand2Emoji</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Inter', sans-serif;
    }

    #video, #canvas {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    #video  { transform: scaleX(-1); z-index: 0; }
    #canvas { z-index: 1; }

    .ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .hud-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,.55) 0%, transparent 100%);
    }

    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: .75rem;
      font-weight: 500;
      color: rgba(255,255,255,.9);
      letter-spacing: .12em;
      text-transform: uppercase;
      line-height: 1;
    }
    .logo span { color: rgba(167,139,250,.9); }

    .hud-top-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: .5rem;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: .45rem;
      padding: .3rem .8rem;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid transparent;
      font-family: 'JetBrains Mono', monospace;
      font-size: .6rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      pointer-events: all;
      transition: background .4s, border-color .4s, color .4s;
    }
    .status-pill.waking {
      background: rgba(251,191,36,.12);
      border-color: rgba(251,191,36,.3);
      color: #FBBF24;
    }
    .status-pill.online {
      background: rgba(52,211,153,.1);
      border-color: rgba(52,211,153,.25);
      color: #34D399;
    }
    .pill-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    .status-pill.waking .pill-dot { animation: waking-pulse 1.1s ease-in-out infinite; }
    .status-pill.online .pill-dot { animation: online-blink 2.4s ease-in-out infinite; }
    @keyframes waking-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.25;transform:scale(.65)} }
    @keyframes online-blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    .fps-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: .58rem;
      color: rgba(255,255,255,.25);
      letter-spacing: .06em;
    }

    .hud-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .6rem;
      pointer-events: none;
    }

    .ring-wrap {
      position: relative;
      width: 130px; height: 130px;
      display: flex; align-items: center; justify-content: center;
    }
    .ring-svg {
      position: absolute;
      inset: 0; width: 100%; height: 100%;
      transform: rotate(-90deg);
    }
    .ring-track {
      fill: none;
      stroke: rgba(255,255,255,.08);
      stroke-width: 2.5;
    }
    .ring-progress {
      fill: none;
      stroke: rgba(167,139,250,.85);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 339.3;
      stroke-dashoffset: 339.3;
      transition: stroke-dashoffset .08s linear, stroke .3s;
    }
    .ring-progress.cooldown { stroke: rgba(251,191,36,.8); }

    .emoji-big {
      font-size: 4.5rem;
      line-height: 1;
      filter: drop-shadow(0 2px 24px rgba(0,0,0,.6));
      transition: transform .15s;
    }
    .emoji-big.pop { animation: em-pop .28s cubic-bezier(.34,1.56,.64,1); }
    @keyframes em-pop { 0%{transform:scale(.4) rotate(-10deg)} 100%{transform:scale(1) rotate(0)} }

    .gesture-name {
      font-size: .7rem;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255,255,255,.4);
      text-shadow: 0 1px 8px rgba(0,0,0,.8);
    }
    .gesture-name.active { color: rgba(255,255,255,.75); }

    .hud-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 1.5rem;
      background: linear-gradient(to top, rgba(0,0,0,.7) 0%, transparent 100%);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
    }

    .gestures-strip {
      display: flex;
      gap: .5rem;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
      padding-bottom: 2px;
      pointer-events: all;
    }
    .gestures-strip::-webkit-scrollbar { display: none; }

    .chip {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .2rem;
      padding: .5rem .45rem;
      border-radius: 10px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all .2s;
      min-width: 52px;
      cursor: default;
    }
    .chip.active {
      background: rgba(167,139,250,.18);
      border-color: rgba(167,139,250,.45);
      transform: translateY(-3px);
    }
    .chip-em { font-size: 1.25rem; line-height: 1; }
    .chip-nm {
      font-size: .32rem;
      font-family: 'JetBrains Mono', monospace;
      color: rgba(255,255,255,.35);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: .04em;
      line-height: 1.3;
    }
    .chip.active .chip-nm { color: rgba(167,139,250,.9); }

    .controls {
      display: flex;
      flex-direction: column;
      gap: .45rem;
      flex-shrink: 0;
      pointer-events: all;
    }
    .btn {
      font-family: 'Inter', sans-serif;
      font-size: .72rem;
      font-weight: 600;
      padding: .55rem 1.1rem;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      letter-spacing: .02em;
    }
    .btn-start {
      background: rgba(167,139,250,.15);
      border-color: rgba(167,139,250,.35);
      color: rgba(255,255,255,.9);
    }
    .btn-start:hover:not(:disabled) { background: rgba(167,139,250,.28); }
    .btn-stop {
      background: rgba(248,113,113,.1);
      border-color: rgba(248,113,113,.25);
      color: rgba(248,113,113,.9);
    }
    .btn-stop:hover:not(:disabled) { background: rgba(248,113,113,.2); }
    .btn:disabled { opacity: .3; cursor: not-allowed; }

    .hand-tag {
      position: absolute;
      top: 1.4rem; left: 50%; transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: .58rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255,255,255,.22);
      text-shadow: 0 1px 6px rgba(0,0,0,.9);
      transition: color .3s;
      white-space: nowrap;
      pointer-events: none;
    }
    .hand-tag.detected { color: rgba(52,211,153,.7); }

    .start-overlay {
      position: fixed;
      inset: 0; z-index: 30;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
    }
    .start-overlay.hidden { display: none; }
    .ovl-emoji { font-size: 4rem; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .ovl-title { font-size: 1.1rem; font-weight: 600; color: rgba(255,255,255,.85); letter-spacing: -.01em; }
    .ovl-sub   { font-size: .78rem; color: rgba(255,255,255,.35); margin-top: -.4rem; }
    .btn-ovl {
      margin-top: .4rem;
      font-family: 'Inter', sans-serif;
      font-size: .82rem; font-weight: 600;
      padding: .7rem 2.2rem; border-radius: 10px;
      border: 1px solid rgba(167,139,250,.45);
      background: rgba(167,139,250,.15);
      color: rgba(255,255,255,.9);
      cursor: pointer; transition: all .2s; letter-spacing: .02em;
    }
    .btn-ovl:hover:not(:disabled) { background: rgba(167,139,250,.28); }
    .btn-ovl:disabled { opacity: .35; cursor: not-allowed; }

    .corner { position: fixed; width: 20px; height: 20px; z-index: 11; pointer-events: none; opacity: .35; }
    .corner.tl { top: 1rem; left: 1rem; border-top: 1.5px solid #A78BFA; border-left: 1.5px solid #A78BFA; }
    .corner.tr { top: 1rem; right: 1rem; border-top: 1.5px solid #A78BFA; border-right: 1.5px solid #A78BFA; }
    .corner.bl { bottom: 1rem; left: 1rem; border-bottom: 1.5px solid #A78BFA; border-left: 1.5px solid #A78BFA; }
    .corner.br { bottom: 1rem; right: 1rem; border-bottom: 1.5px solid #A78BFA; border-right: 1.5px solid #A78BFA; }
  </style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="ui">
  <div class="hud-top">
    <div class="logo">Hand<span>/</span>2<span>/</span>Emoji</div>
    <div class="hud-top-right">
      <div class="status-pill waking" id="statusPill">
        <div class="pill-dot"></div>
        <span id="statusText">Despertando servidor</span>
      </div>
      <div class="fps-label" id="fpsLabel">-- fps</div>
    </div>
  </div>

  <div class="hand-tag" id="handTag">Sin mano detectada</div>

  <div class="hud-center">
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 120 120">
        <circle class="ring-track"    cx="60" cy="60" r="54"/>
        <circle class="ring-progress" id="ringArc" cx="60" cy="60" r="54"/>
      </svg>
      <span class="emoji-big" id="emojiMain">🤚</span>
    </div>
    <div class="gesture-name" id="gestureName">muestra tu mano</div>
  </div>

  <div class="hud-bottom">
    <div class="gestures-strip" id="chipsGrid"></div>
    <div class="controls">
      <button class="btn btn-start" id="btnStart" disabled>▶ Iniciar</button>
      <button class="btn btn-stop"  id="btnStop"  disabled>■ Detener</button>
    </div>
  </div>
</div>

<div class="start-overlay" id="startOverlay">
  <div class="ovl-emoji">🖐️</div>
  <div class="ovl-title">Hand2Emoji</div>
  <div class="ovl-sub">Detección de gestos en tiempo real</div>
  <button class="btn-ovl" id="btnOverlay" disabled>▶ Activar cámara</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script>
// ── CONFIG ──
const API_URL = window.location.hostname === 'localhost'
  ? 'http://localhost:8000'
  : 'https://hand2emoji.onrender.com';  // ← URL correcta

const HOLD_MS  = 900;
const COOL_MS  = 1000;
const THROTTLE = 180;
const CIRC     = 2 * Math.PI * 54;

// ── ESTADO ──
let state = 'listening', candidate = null, holdStart = null;
let lastCall = 0, prevGesto = null;
let frames = 0, fpsT = Date.now(), mpCam = null;

// ── DOM ──
const video       = document.getElementById('video');
const canvas      = document.getElementById('canvas');
const ctx         = canvas.getContext('2d');
const emojiMain   = document.getElementById('emojiMain');
const gestureName = document.getElementById('gestureName');
const ringArc     = document.getElementById('ringArc');
const handTag     = document.getElementById('handTag');
const chipsGrid   = document.getElementById('chipsGrid');
const btnStart    = document.getElementById('btnStart');
const btnStop     = document.getElementById('btnStop');
const btnOverlay  = document.getElementById('btnOverlay');
const startOvl    = document.getElementById('startOverlay');
const statusPill  = document.getElementById('statusPill');
const statusText  = document.getElementById('statusText');
const fpsLabel    = document.getElementById('fpsLabel');

// ── RING ──
function setRing(pct, cooldown) {
  ringArc.style.strokeDashoffset = CIRC - (pct / 100) * CIRC;
  ringArc.className = 'ring-progress' + (cooldown ? ' cooldown' : '');
}

// ── API ──
// Lógica simple:
// éxito  → online verde, habilita botones, carga gestos
// fallo  → waking amarillo, deshabilita botones
// el setInterval de 5s sigue reintentando hasta que despierte
async function checkAPI() {
  try {
    const r = await fetch(`${API_URL}/health`, { signal: AbortSignal.timeout(5000) });
    if (!r.ok) throw new Error();
    statusPill.className   = 'status-pill online';
    statusText.textContent = 'API online';
    btnStart.disabled      = false;
    btnOverlay.disabled    = false;
    loadGestos();
  } catch {
    statusPill.className   = 'status-pill waking';
    statusText.textContent = 'Despertando servidor';
    btnStart.disabled      = true;
    btnOverlay.disabled    = true;
  }
}

async function loadGestos() {
  try {
    const r = await fetch(`${API_URL}/gestos`);
    const d = await r.json();
    chipsGrid.innerHTML = '';
    d.gestos.forEach(g => {
      const el = document.createElement('div');
      el.className = 'chip';
      el.id = `chip-${g.nombre}`;
      el.innerHTML = `<span class="chip-em">${g.emoji}</span><span class="chip-nm">${g.nombre.replace(/_/g,' ')}</span>`;
      chipsGrid.appendChild(el);
    });
  } catch(e) { console.warn('Error cargando gestos:', e); }
}

// ── NORMALIZACIÓN ──
function normalize(lms, W, H) {
  const mx = lms[0].x * W, my = lms[0].y * H, mz = lms[0].z;
  const r9x = lms[9].x * W, r9y = lms[9].y * H, r9z = lms[9].z;
  const s = Math.sqrt((r9x-mx)**2 + (r9y-my)**2 + (r9z-mz)**2) + 1e-6;
  const xs=[], ys=[], zs=[];
  for (const p of lms) {
    xs.push((p.x*W - mx) / s);
    ys.push((p.y*H - my) / s);
    zs.push((p.z    - mz) / s);
  }
  return [...xs, ...ys, ...zs];
}

// ── PREDICCIÓN ──
async function predict(lms, lado, W, H) {
  try {
    const r = await fetch(`${API_URL}/predict`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ landmarks: normalize(lms, W, H), lado }),
      signal: AbortSignal.timeout(2000)
    });
    return await r.json();
  } catch { return null; }
}

// ── CONFIRMAR GESTO ──
function confirmar(res) {
  const { gesto, emoji } = res;
  if (gesto !== prevGesto) {
    emojiMain.classList.remove('pop');
    void emojiMain.offsetWidth;
    emojiMain.classList.add('pop');
    prevGesto = gesto;
  }
  emojiMain.textContent   = emoji;
  gestureName.textContent = gesto.replace(/_/g, ' ');
  gestureName.className   = 'gesture-name active';
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  document.getElementById(`chip-${gesto}`)?.classList.add('active');

  state = 'cooldown'; candidate = null; holdStart = null;
  setRing(100, true);
  setTimeout(() => {
    state = 'listening'; candidate = null;
    setRing(0, false);
  }, COOL_MS);
}

function resetDisplay() {
  emojiMain.textContent   = '🤚';
  gestureName.textContent = 'muestra tu mano';
  gestureName.className   = 'gesture-name';
  setRing(0, false);
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  prevGesto = null;
}

// ── MEDIAPIPE ──
const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
hands.setOptions({ maxNumHands:1, modelComplexity:1, minDetectionConfidence:.75, minTrackingConfidence:.6 });

hands.onResults(async results => {
  const W = video.videoWidth || 640, H = video.videoHeight || 480;
  canvas.width = W; canvas.height = H;
  ctx.clearRect(0, 0, W, H);

  frames++;
  const now = Date.now();
  if (now - fpsT >= 1000) {
    fpsLabel.textContent = `${frames} fps`;
    frames = 0; fpsT = now;
  }

  if (!results.multiHandLandmarks?.length) {
    handTag.textContent = 'Sin mano detectada';
    handTag.className   = 'hand-tag';
    if (state !== 'cooldown') { candidate = null; holdStart = null; state = 'listening'; }
    return;
  }

  const lms = results.multiHandLandmarks[0];
  handTag.textContent = '✦ Mano detectada';
  handTag.className   = 'hand-tag detected';

  drawConnectors(ctx, lms, HAND_CONNECTIONS, { color:'rgba(167,139,250,.4)', lineWidth:1.5 });
  drawLandmarks(ctx, lms, { color:'rgba(45,212,191,.8)', lineWidth:1, radius:3 });

  if (state === 'cooldown' || now - lastCall < THROTTLE) return;
  lastCall = now;

  const lado = results.multiHandedness[0].label === 'Right' ? 'Left' : 'Right';
  const res  = await predict(lms, lado, W, H);
  if (!res || !res.detectado) { candidate = null; holdStart = null; return; }

  if (state === 'listening') {
    candidate = res.gesto; holdStart = now; state = 'holding';
  } else if (state === 'holding') {
    if (res.gesto !== candidate) {
      candidate = res.gesto; holdStart = now; setRing(0, false);
    } else {
      const elapsed = now - holdStart;
      setRing(Math.min((elapsed / HOLD_MS) * 100, 100), false);
      if (elapsed >= HOLD_MS) confirmar(res);
    }
  }
});

// ── CÁMARA ──
async function startCam() {
  btnStart.disabled = true;
  btnStart.textContent = '⏳ Iniciando...';
  startOvl.classList.add('hidden');
  try {
    mpCam = new Camera(video, {
      onFrame: async () => { await hands.send({ image: video }); },
      width: 1280, height: 720
    });
    await mpCam.start();
    btnStart.textContent = '✓ Activa';
    btnStop.disabled = false;
  } catch {
    startOvl.classList.remove('hidden');
    btnStart.disabled = false;
    btnStart.textContent = '▶ Iniciar';
    alert('No se pudo acceder a la cámara.');
  }
}

function stopCam() {
  if (mpCam) { mpCam.stop(); mpCam = null; }
  btnStart.disabled    = false; btnStart.textContent = '▶ Iniciar';
  btnStop.disabled     = true;
  startOvl.classList.remove('hidden');
  state = 'listening'; candidate = null; holdStart = null;
  resetDisplay();
}

btnStart.addEventListener('click',   startCam);
btnStop.addEventListener('click',    stopCam);
btnOverlay.addEventListener('click', startCam);

// ── INIT ──
checkAPI();
setInterval(checkAPI, 5000);                                          // reintenta cada 5s
setInterval(() => fetch(`${API_URL}/health`).catch(()=>{}), 14*60*1000); // keep-alive
</script>
</body>
</html>
